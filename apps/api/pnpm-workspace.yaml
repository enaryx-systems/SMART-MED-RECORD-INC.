allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  prisma: true

# deepmerge-ts GHSA-ggr8-5vv4-36mx (stack exhaustion on deeply recursive object
# graphs) reaches us only through the Prisma CLI's own @prisma/config — build/CLI
# tooling, never the running server. Drop when a Prisma release bumps it to >=8.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx
