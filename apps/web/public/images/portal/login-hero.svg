<svg width="800" height="1100" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secure medical records flowing into a protected workspace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062E27" />
      <stop offset="55%" stop-color="#00453A" />
      <stop offset="100%" stop-color="#012620" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00856F" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#00856F" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00856F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3c07a" />
      <stop offset="100%" stop-color="#b78a3d" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A98A" />
      <stop offset="100%" stop-color="#00453A" />
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DCE9E2" opacity="0.16" />
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00120E" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="1100" fill="url(#bgGrad)" />
  <rect width="800" height="1100" fill="url(#dots)" />
  <circle cx="430" cy="470" r="340" fill="url(#glow)" filter="url(#soft)" />

  <g stroke="#DCE9E2" stroke-opacity="0.12" stroke-width="1">
