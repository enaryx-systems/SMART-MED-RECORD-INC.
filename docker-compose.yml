services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartmed
      POSTGRES_PASSWORD: smartmed
      POSTGRES_DB: smartmed
    ports: ["5432:5432"]
    volumes: ["smartmed-db:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [postgres, redis]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  smartmed-db:
